version: '3.8'

services:
  auth-service:
    build:
      context: ../auth-service
    ports:
      - "3001:3001"
    env_file:
      - ../auth-service/.env

  doc-api:
    build:
      context: ../doc-api
    ports:
      - "8000:8000"
      - "8001:8000"
    env_file:
      - ../doc-api/.env

  frontend-app:
    build:
      context: ../frontend-app
    ports:
      - "3002:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true

  gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - doc-api
      - frontend-app
