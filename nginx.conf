events {}

http {
    server {
        listen 80;

        location /admin/ {
            # Internal admin access only - restricted to internal network
            set $real_ip $http_x_forwarded_for;
            if ($real_ip !~ "^10\.0\.") {
                return 403;
            }
            proxy_pass http://doc-api:8000/admin/;
            proxy_set_header Host $host;
        }

        location /auth/ {
            proxy_pass http://auth-service:3001/;
            proxy_set_header Host $host;
        }

        location /api/ {
            proxy_pass http://doc-api:8000/;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://frontend-app:3000/;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
