events {}

http {
    server {
        listen 80;

        location /auth/ {
            proxy_pass http://auth-service:3001/;
            proxy_set_header Host $host;
        }

        location /api/documents {
            # Method-based authorization: only GET allowed without auth
            # POST/PUT/DELETE require authentication (enforced by backend)
            if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
                set $auth_required "true";
            }
            proxy_pass http://doc-api:8000/documents;
            proxy_set_header Host $host;
            proxy_set_header X-Auth-Required $auth_required;
        }

        location /api/ {
            proxy_pass http://doc-api:8000/;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://frontend-app:3000/;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
