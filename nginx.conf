events {}

http {
    server {
        listen 80;

        location /auth/ {
            proxy_pass http://auth-service:3001/;
            proxy_set_header Host $host;
        }

        location /internal/ {
            # Internal monitoring endpoints - restricted to private networks only
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://doc-api:8000/internal/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/ {
            proxy_pass http://doc-api:8000/;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://frontend-app:3000/;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
